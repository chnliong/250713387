<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<!-- Deklarasi XHTML, dengan dasar aturannya adalah HTML yang mengikuti aturan XML -->
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Halaman saya</title>
</head>
<!-- Bagian kepala halaman. Informasi dapat dilihat pada jendela halaman website, dimana 
 judul halaman akan ditampilkan-->

<body>
    <h1>Judul Halaman</h1>
    <h6>Subjudul Halaman atau <em>heading 6</em></h6>
    <p>Tag p digunakan untuk membuat <strong>paragraf</strong> dalam dokumen XHTML.</p>
</body>
<!--- Bagian tubuh halaman, dimana informasi yang ditampilkan berupa konten halaman-->
</html>
